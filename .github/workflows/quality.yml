name: Quality checks

on:
  push:
    branches:
      - contest-2026-onnx
      - contest-2026-v2-final
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check collector.js
          node --check benchmark.js
          node --check benchmark-v2.js
          node --check src/feature-schema.js
          node --check src/inference-engine.js
          node --check src/cafe-decoder.js
          node --check src/study-logger.js
          node --check pilot-dashboard.js
          node --check pilot-survey.js
          node --check tests/feature_smoke.mjs
          node --check tests/feature_parity.mjs
          node --check tests/runtime_policy.mjs

      - name: JavaScript feature and decoder smoke test
        run: node tests/feature_smoke.mjs

      - name: Runtime sampling and segmentation policy
        run: node tests/runtime_policy.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: python -m py_compile training/*.py tools/*.py tests/*.py

      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2"

      - name: Python feature self-test
        run: python training/features.py

      - name: JS/Python feature parity
        run: python tests/feature_parity.py

      - name: Dataset grouped-split smoke test
        run: python tests/dataset_smoke.py
